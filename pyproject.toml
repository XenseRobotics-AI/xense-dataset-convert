[project]
name = "hdf52lerobot"
version = "0.1.0"
description = "Convert raw UMI-rig HDF5/MKV recordings into a LeRobot v3.0 dataset"
readme = "README.md"
requires-python = ">=3.10"
# No lerobot at runtime: the v3.0 layout is written directly, so only the
# storage/codec libraries are needed.
dependencies = [
  "av==15.1.0",
  "h5py>=3.8",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6.0",
  "spdlog>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/XenseRobotics-AI/lerobot2mcap"
Repository = "https://github.com/XenseRobotics-AI/lerobot2mcap"
Issues = "https://github.com/XenseRobotics-AI/lerobot2mcap/issues"

[project.scripts]
hdf52lerobot = "hdf52lerobot.cli:main"

[tool.setuptools]
packages = ["hdf52lerobot"]

[tool.setuptools.package-data]
"*" = ["../configs/*.yaml"]

[tool.uv]
package = true
