# Strict profile for one MCAP containing DAS Ego (robot0), left Finger
# (robot1), and right Finger (robot2). Topic names may be overridden here.
fps: 30
robot_type: das_umi
task: DAS UMI sensor capture

# DAS Fingers official nominal jaw opening is 0-220 mm. Schema v3 clips
# source metre values to this range, maps closed/open to 0/1, and quantizes to
# two decimal places. Override only for a separately calibrated hardware model.
gripper_normalization:
  min_opening_m: 0.000
  max_opening_m: 0.220
  decimals: 2

quality:
  max_header_log_offset_ms: 1.0
  max_start_offset_ms: 100.0
  max_end_offset_ms: 100.0
  leading_video_crop_ms: 1000.0
  period_multiplier: 2.0
  match_slack_ms: 0.5
  ego_camera_span_ms: 1.0
  output_camera_span_ms: 33.333334

streams:
  - {key: camera0, topic: /robot0/sensor/camera0/compressed, kind: video, feature: observation.images.camera0, rate_hz: 30, required: true}
  - {key: camera1, topic: /robot0/sensor/camera1/compressed, kind: video, feature: observation.images.camera1, rate_hz: 30, required: true}
  - {key: camera2, topic: /robot0/sensor/camera2/compressed, kind: video, feature: observation.images.camera2, rate_hz: 30, required: true}
  - {key: camera3, topic: /robot0/sensor/camera3/compressed, kind: video, feature: observation.images.camera3, rate_hz: 30, required: true}
  - {key: camera4, topic: /robot0/sensor/camera4/compressed, kind: video, feature: observation.images.camera4, rate_hz: 30, required: true}
  - {key: camera5, topic: /robot0/sensor/camera5/compressed, kind: video, feature: observation.images.camera5, rate_hz: 30, required: true}
  - {key: left_wrist, topic: /robot1/sensor/camera0/compressed, kind: video, feature: observation.images.left_wrist, rate_hz: 30, required: true}
  - {key: right_wrist, topic: /robot2/sensor/camera0/compressed, kind: video, feature: observation.images.right_wrist, rate_hz: 30, required: true}

  - {key: ego_imu, topic: /robot0/sensor/imu, kind: imu, feature: observation.imu, rate_hz: 200, required: true}
  - {key: left_imu, topic: /robot1/sensor/imu, kind: imu, feature: observation.imu.left_wrist, rate_hz: 200, required: true}
  - {key: right_imu, topic: /robot2/sensor/imu, kind: imu, feature: observation.imu.right_wrist, rate_hz: 200, required: true}
  # Encoder features below are internal sampling keys, not exported raw-value columns.
  # Schema v3 maps metre-valued opening distance to gripper.pos in [0, 1].
  # Schemas v1/v2 preserve the legacy raw float32 value for reproducibility.
  - {key: left_magnetic, topic: /robot1/sensor/magnetic_encoder, kind: magnetic, feature: observation.magnetic.left.raw_value, rate_hz: 50, required: true, state_block: left_magnetic}
  - {key: right_magnetic, topic: /robot2/sensor/magnetic_encoder, kind: magnetic, feature: observation.magnetic.right.raw_value, rate_hz: 50, required: true, state_block: right_magnetic}

  # DAS records the VIO end-effector pose in both the Foxglove timestamp and
  # arnold header. The header timestamp is the acquisition clock used here.
  - {key: head_world_pose, topic: /robot0/vio/eef_pose, kind: pose, feature: observation.pose.head_world, rate_hz: 30, required: true, state_block: head_pose}

  # The relative VIO pose is exported separately but does not enter head state.
  - {key: head_relative_pose, topic: /robot0/vio/relative_eef_pose, kind: pose, feature: observation.pose.head_relative, rate_hz: 30, required: true}
  # Optional hand PoseInFrame topics produce the full 29-dimensional state.
  - {key: left_hand_pose, topic: null, kind: pose, feature: observation.pose.left_hand, rate_hz: 30, required: false, state_block: left_pose}
  - {key: right_hand_pose, topic: null, kind: pose, feature: observation.pose.right_hand, rate_hz: 30, required: false, state_block: right_pose}

# These topics are retained as JSON metadata, not frame columns. Additional
# topics containing calibration/intrinsic/extrinsic are classified likewise.
calibration_topics: []
