# None of the four packages declared a build backend before they were merged,
# which left the backend up to whatever the installer defaulted to. Naming it
# explicitly is what lets `pip install -e .` use PEP 660 editable installs --
# though a pip old enough to predate that (22.x) still refuses either way.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xense-dataset-convert"
version = "0.3.17"
description = "Robot dataset format converters: LeRobot <-> MCAP, LeRobot -> Zarr, raw UMI HDF5 -> LeRobot"
readme = "README.md"

# lerobot 0.5+ and 0.6+ both require 3.12, as does the xense-taccap-lerobot fork.
requires-python = ">=3.12"

# The union of what the four converters need.
#
# lerobot >=0.6.1 supplies RGBEncoderConfig, required for lossless RGB XTac
# video writing. Keep the <0.7 cap until its writer API has been tested.
# The [dataset] extra supplies datasets, pyarrow, pandas and torchcodec.
#
# av and numpy stay on the ranges lerobot itself declares rather than tightening
# past them: `av==15.1.0` would block lerobot from moving anywhere inside 15.x.
#
# lerobot2mcap, lerobot2zarr and mcap2lerobot use lerobot's Python API
# (LeRobotDataset for reading, LeRobotDataset.create for writing); hdf52lerobot
# writes the v3.0 layout itself. Installing this distribution pulls lerobot's
# torch stack for all four -- a deliberate trade for a single, no-extras install.
#
# tqdm is imported directly by lerobot2mcap; it also arrives via tabular2mcap and
# lerobot, but a direct import gets a direct declaration.
#
# The `ffmpeg` binary is a system requirement (lerobot2mcap shells out to it);
# see README for the conda recipe.
dependencies = [
  "lerobot[dataset]>=0.6.1,<0.7",
  "tabular2mcap[protobuf]==0.1.12",
  "tqdm>=4.60",
  "av>=15.0.0,<16.0.0",
  "spdlog>=2.0.0",
  "numpy>=1.26.4",
  "zarr>=2.18,<3",
  "numcodecs>=0.12,<0.16",
  "mcap>=1.3.0",
  "mcap-ros2-support>=0.5.5",
  "mcap-protobuf-support>=0.5.0",
  "h5py>=3.8",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/XenseRobotics-AI/xense-dataset-convert"
Repository = "https://github.com/XenseRobotics-AI/xense-dataset-convert"
Issues = "https://github.com/XenseRobotics-AI/xense-dataset-convert/issues"

[project.scripts]
lerobot2mcap = "lerobot2mcap:main"
lerobot2zarr = "lerobot2zarr.zarr_cli:main"
mcap2lerobot = "mcap2lerobot.cli:main"
hdf52lerobot = "hdf52lerobot.cli:main"
rlds2lerobot = "rlds2lerobot.cli:main"

[project.optional-dependencies]
# `pip install -e .[dev]` -- what the test suite and the CI lint job need.
dev = ["pytest>=8", "ruff"]
rlds = ["tensorflow>=2.16", "tensorflow-datasets>=4.9"]

[tool.setuptools]
packages = [
  "lerobot2mcap",
  "lerobot2zarr",
  "mcap2lerobot",
  "hdf52lerobot",
  "xense_dataset_convert",
  "xense_dataset_convert.adapters",
  "rlds2lerobot",
]

[tool.setuptools.package-data]
"*" = ["../configs/*.yaml"]

[tool.uv]
package = true

[tool.pytest.ini_options]
# Make the packages importable without installing the project, and without
# depending on which test module happens to be collected first.
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
hardware = ["lerobot[feetech]>=0.5.1,<0.7"]
