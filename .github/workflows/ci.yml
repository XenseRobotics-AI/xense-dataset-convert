name: CI

# No `paths:` filter on purpose: `lint` is a required status check on main, and a
# path-filtered workflow reports nothing on PRs that miss the filter — such a PR
# would sit at "pending" forever and never become mergeable.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The project's own dependencies are deliberately NOT installed: pyproject
      # pins lerobot==0.4.1, which drags in a full torch stack for a job that only
      # needs to parse the source. The checks below are import-free.
      - name: Install tools
        run: pip install --upgrade pip ruff

      # Fatal errors only — syntax errors and undefined names. This repo has never
      # been linted, so a full rule set would fail on pre-existing style. Widen the
      # selection once the backlog is cleared.
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 .

      - name: Syntax check
        run: python -m compileall -q lerobot2mcap hdf52lerobot tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only hdf52lerobot's dependencies: it writes the LeRobot v3.0 layout itself,
      # so its suite runs without the torch stack that lerobot==0.4.1 would pull in.
      # The lerobot2mcap tests still need a real dataset on disk and stay excluded.
      - name: Install test dependencies
        run: pip install --upgrade pip pytest h5py numpy pandas pyarrow PyYAML "av==15.1.0"

      - name: Test hdf52lerobot
        run: python -m pytest tests/test_hdf52lerobot.py -q
