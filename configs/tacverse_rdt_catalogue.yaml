# Task catalogue for the TacVerse-RDT recordings: the capture team's task codes
# A1-A37, with the English task text a converted dataset carries and the slug
# its directory name is built from.
#
#   <prefix>-<slug>-<MMDD>     e.g. xtac-rdt-umi-shake-liquid-bottle-0822
#
# `zh` is the capture team's own wording from 采集任务时间安排表.xlsx sheet 1,
# kept beside the translation so a reviewer can check one against the other; it
# is never written into a dataset. `en` follows the TacVerse house style: an
# imperative sentence naming the objects and, where the schedule defines one,
# the condition that ends the episode.
#
# `objects` and `gel` come from the same sheet. The gel layer (thick / thin) is
# a property of the hardware for that session, not of the task, and is recorded
# here so meta/hardware.json can carry it later.
#
# DRAFT: every `en` line is a translation awaiting review. The terms of art --
# 临界压溃 (crushing at the plastic-deformation threshold), 瞬态滑移 (transient
# slip), 抗滑移 (slip resistance) -- are the ones worth checking first.

version: 1

tasks:
  A1:
    category: limit
    gel: thick
    objects: [aluminium foil, paper cup, plastic bottle]
    zh: 临界压溃/塑性形变物品抓取，持续加压，从弹性形变到产生永久变形、挤压塌陷
    en: Grasp the deformable object and keep increasing the grip force, carrying it from elastic deformation through to permanent deformation until the object collapses.
    slug: crush-object-to-collapse

  A2:
    category: limit
    gel: thick
    objects: [bottle, cylindrical object]
    zh: 轻微扰动抗滑移 夹紧物体后，施加小幅水平推拉、小幅抖动
    en: Grip the bottle firmly, then push, pull and shake it horizontally by small amounts so that it resists slipping in the fingers.
    slug: resist-slip-horizontal-disturbance

  A3:
    category: limit
    gel: thick
    objects: [bottle, cylindrical object]
    zh: 轻微扰动抗滑移 夹紧物体后，施加小幅纵向推拉、小幅抖动
    en: Grip the bottle firmly, then push, pull and shake it vertically by small amounts so that it resists slipping in the fingers.
    slug: resist-slip-vertical-disturbance

  A4:
    category: limit
    gel: thick
    objects: [silicone sheet, tarpaulin]
    zh: 往复拖拽、往复摩擦软质物品
    en: Hold the soft sheet and drag it back and forth across the table, rubbing and smoothing it repeatedly.
    slug: drag-and-smooth-soft-sheet

  A5:
    category: limit
    gel: thin
    objects: [assorted small objects]
    zh: 临界打滑瞬间（瞬态滑移）不同物品从夹爪滑落到托盘
    en: Hold each object at the edge of slipping and let it slide out of the fingers into the tray, capturing the moment the grip gives way.
    slug: let-object-slip-into-tray

  A6:
    category: limit
    gel: thin
    objects: [assorted small objects]
    zh: 轻抛放置（轻抛物品到框里面）
    en: Pick up each small object and toss it gently into the bin.
    slug: toss-object-into-bin

  A7:
    category: regular
    gel: thick
    objects: [plug, power strip]
    zh: 插拔USB，USB数据线和插头插拔，组装好之后，插头和插线板插拔
    en: Plug the USB cable into the adapter and pull it out again, then plug the adapter into the power strip and pull it out again.
    slug: plug-and-unplug-usb

  A8:
    category: regular
    gel: thick
    objects: [screw, nut]
    zh: 拧螺丝
    en: Turn the screw into the nut until it is tight, then back it out again.
    slug: tighten-screw

  A9:
    category: regular
    gel: thick
    objects: [screw, nut]
    zh: 拧螺母
    en: Turn the nut onto the screw until it is tight, then back it off again.
    slug: tighten-nut

  A10:
    category: regular
    gel: thick
    objects: [drink bottle, reagent bottle]
    zh: 可以拧开盖的物品，把盖子拧开，再拧回去。
    en: Unscrew the cap from the bottle, set it down, then screw it back on until it is closed.
    slug: unscrew-and-refit-cap

  A11:
    category: regular
    gel: thin
    objects: [drink bottle, reagent bottle]
